<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<title>TeamPulse Knowledge Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,700;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one centred access card on a steel-textured navy field; deliberately carries no company branding */
:root{--field:#0f1d3a;--field2:#1b3363;--card:#ffffff;--ink:#111b31;--muted:#58647a;--rule:#d5dbe6;--accent:#e52726;--accent-ink:#b81f1e;--err:#b42318;--errbg:#fdecea;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;--f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--card:#141d30;--ink:#e6ebf4;--muted:#9ea9be;--rule:#2a3651;--err:#ff8a80;--errbg:#3a1a1a;--accent-ink:#ff7d7a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--f-body);color:var(--ink);background:linear-gradient(135deg,var(--field),var(--field2));display:grid;place-items:center;padding:24px 16px;position:relative;min-height:100%}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px);pointer-events:none}
.card{position:relative;width:100%;max-width:440px;background:var(--card);border-radius:14px;padding:32px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--accent)}
.brand{text-align:center;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--rule)}
.brand svg{width:40px;height:40px;color:var(--accent);margin-bottom:6px}
.brand .word{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,11vw,3.4rem);line-height:1;letter-spacing:-.02em}
.brand .word span{color:var(--accent)}
.brand .tag{font-family:var(--f-display);font-size:1.12rem;font-style:italic;margin-top:8px;color:var(--ink)}
h1{font-family:var(--f-display);font-size:1.3rem;margin:0 0 6px;line-height:1.25}
p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.55}
form{display:flex;flex-direction:column;gap:14px;margin-top:22px}
label{font-weight:600;font-size:.85rem}
.field{position:relative;margin-top:6px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:1rem;padding:12px 44px 12px 14px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px}
.eye:focus-visible{outline:2px solid var(--accent)}
.remember{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);font-weight:500}
button.go{font:inherit;font-weight:600;font-size:1rem;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
button.go:hover{background:#c91f1e}
button.go:disabled{opacity:.7;cursor:progress}
.err{display:none;background:var(--errbg);color:var(--err);border-radius:8px;padding:10px 12px;font-size:.88rem}
.err.on{display:block}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);font-size:.8rem}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12h4l2.5-6 4 12 2.5-6h6"/></svg>
    <div class="word">Team<span>Pulse</span></div>
    <div class="tag">Knowledge &amp; Learning Hub</div>
  </div>
  <h1>Enter the access password</h1>
  <p>This learning hub is for invited colleagues only.</p>
  <form id="f" autocomplete="off">
    <div><label for="pw">Password</label>
      <div class="field"><input id="pw" type="password" required autofocus spellcheck="false" autocapitalize="off">
      <button class="eye" type="button" id="eye" aria-label="Show password"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
    <label class="remember" for="rm"><input id="rm" type="checkbox" checked> Keep me signed in on this device</label>
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" type="submit">Open the hub</button>
  </form>
  <p class="foot">Don't have the password? Ask the person who shared this link with you.</p>
</main>

<script>
(function(){
"use strict";
var P=JSON.parse(document.getElementById('payload').textContent);
var KEY='tp-access';
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var err=document.getElementById('err'),go=document.getElementById('go');
function show(m){err.textContent=m;err.classList.add('on')}
if(!window.crypto||!crypto.subtle){show('This browser cannot open protected pages. Please use a current version of Chrome, Edge, Safari or Firefox.');go.disabled=true;return}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])})}
function dec(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c)).then(function(buf){return new TextDecoder().decode(buf)})}
function render(html){document.open();document.write(html);document.close()}
function save(key){return crypto.subtle.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,JSON.stringify({s:P.s,k:tob64(raw)}))}catch(e){}})}
/* returning reader on this device */
try{var st=JSON.parse(localStorage.getItem(KEY)||'null');
  if(st&&st.s===P.s){crypto.subtle.importKey('raw',b64(st.k),{name:'AES-GCM'},false,['decrypt']).then(dec).then(render).catch(function(){try{localStorage.removeItem(KEY)}catch(e){}})}
}catch(e){}
document.getElementById('eye').addEventListener('click',function(){var i=document.getElementById('pw');var on=i.type==='password';i.type=on?'text':'password';this.setAttribute('aria-label',on?'Hide password':'Show password')});
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();err.classList.remove('on');go.disabled=true;go.textContent='Checking…';
  var pw=document.getElementById('pw').value,rm=document.getElementById('rm').checked,k;
  var html;derive(pw).then(function(key){k=key;return dec(key)}).then(function(h){html=h;return rm?save(k):null}).then(function(){render(html)})
  .catch(function(){go.disabled=false;go.textContent='Open the hub';show('That password is not correct. Check it and try again.')});
});
})();
</script>
